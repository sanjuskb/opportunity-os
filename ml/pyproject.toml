[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opportunity-os-ml"
version = "0.1.0"
description = "Machine Learning pipelines, embeddings, and ranking models for Opportunity OS"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sanju", email = "sanju.skb.191144@gmail.com" }
]
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "sentence-transformers>=2.5.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "jupyterlab>=4.1.0"
]
export = [
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
