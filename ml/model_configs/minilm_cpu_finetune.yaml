# CPU Fine-Tuning Configuration for NexteRaS (`ml` branch)
# Hardware Target: Windows 11 · Intel Core i5-1334U (10C/12T) · 16 GB RAM · CPU-Only

experiment_name: "minilm_nexteras_curriculum_v2_cpu"
seed: 42

hardware:
  device: "cpu"
  cpu_threads: 6
  use_fp16: false

model:
  base_model_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dimension: 384
  max_sequence_length: 256

data:
  seed_file: "ml/datasets/synthetic/matching_curriculum_v2.json"
  starter_reference_seed_file: "ml/datasets/synthetic/matching_seed_examples.json"
  processed_dir: "ml/datasets/processed_v2"
  train_file: "ml/datasets/processed_v2/train_pairs.jsonl"
  val_pairs_file: "ml/datasets/processed_v2/val_pairs.jsonl"
  val_queries_file: "ml/datasets/processed_v2/val_queries.jsonl"
  val_corpus_file: "ml/datasets/processed_v2/val_corpus.jsonl"
  test_queries_file: "ml/datasets/processed_v2/test_queries.jsonl"
  test_corpus_file: "ml/datasets/processed_v2/test_corpus.jsonl"

training:
  loss: "MultipleNegativesRankingLoss"
  use_hard_negatives: true
  epochs: 5
  batch_size: 8
  learning_rate: 2.5e-5
  warmup_ratio: 0.1
  weight_decay: 0.01
  selection_metric: "val_ndcg_at_10_plus_margin"

output:
  model_dir: "ml/artifacts/minilm-nexteras-v1"
  report_dir: "ml/experiments/runs"
