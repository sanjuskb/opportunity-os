# NexteRaS Machine Learning Model Registry
# Tracks model versions, ownership, vector dimensions, resource footprint, and truthful lifecycle status.

registry_version: "1.0.0"

models:
  semantic_matcher:
    name: "NexteRaS Semantic Opportunity Matcher"
    model_id: "sentence-transformers/all-MiniLM-L6-v2"
    version: "1.0.0-nexteras-v1"
    model_type: "sentence_transformer_biencoder"
    task: "semantic_opportunity_matching"
    input_schema: "StudentProfileText & OpportunityPassageText"
    output_schema: "NormalizedEmbedding384 & CosineSimilarity"
    embedding_dimension: 384
    local_path: "ml/artifacts/minilm-nexteras-v1"
    fallback_model_id: "sentence-transformers/all-MiniLM-L6-v2"
    license: "Apache-2.0"
    owner: "Team SyNtRax ML Engineering (branch: ml)"
    fine_tuning_status: "completed_synthetic_cpu"
    evaluation_status: "finetuned_vs_baseline_evaluated_synthetic"
    lifecycle_status: "FINE_TUNED"
    approx_ram_mb: 340
    approx_disk_mb: 90
    known_limitations:
      - "Fine-tuned on synthetic contrastive curriculum (48 train / 16 val / 24 untouched test triplets, is_synthetic=true); production generalization still requires real student telemetry."
      - "Outputs 384-dim vectors whereas initial_schema.sql uses vector(768); see additive 20261125000001 migration."
      - "English-centric pretraining; weaker on native Indian scripts without multilingual encoder or translation fallback."
      - "Runtime automatically falls back to pretrained sentence-transformers/all-MiniLM-L6-v2 whenever local_path checkpoint is absent."

  multilingual_encoder:
    name: "NexteRaS Multilingual Understanding Encoder"
    model_id: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    version: "1.0.0-pretrained"
    model_type: "multilingual_sentence_transformer"
    task: "multilingual_text_understanding"
    input_schema: "MultilingualQueryText (en, hi, te, ta, kn, ml, bn, hinglish)"
    output_schema: "NormalizedEmbedding384 & LanguageRetrievalScore"
    embedding_dimension: 384
    local_path: null
    fallback_model_id: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    license: "Apache-2.0"
    owner: "NexteRaS ML Team"
    fine_tuning_status: "pretrained_only"
    evaluation_status: "evaluated_7_indic_languages"
    lifecycle_status: "EVALUATED"
    approx_ram_mb: 750
    approx_disk_mb: 470
    known_limitations:
      - "Slower and heavier on CPU than English all-MiniLM-L6-v2 (~470 MB disk, ~750 MB RAM)."
      - "Romanized Hinglish and colloquial transliteration require LLM/translation fallback when similarity confidence is low."

  evidence_nli_verifier:
    name: "NexteRaS Auxiliary NLI Evidence Consistency Verifier"
    model_id: "cross-encoder/nli-deberta-v3-small"
    version: "1.0.0-pretrained"
    model_type: "nli_cross_encoder"
    task: "requirement_and_claim_consistency"
    input_schema: "(PremiseText, HypothesisClaimText)"
    output_schema: "VerificationResult (supported | contradicted | insufficient_evidence)"
    embedding_dimension: null
    local_path: null
    fallback_model_id: null
    license: "MIT"
    owner: "NexteRaS ML Team"
    fine_tuning_status: "pretrained_only"
    evaluation_status: "evaluated_synthetic_claims"
    lifecycle_status: "EVALUATED"
    approx_ram_mb: 850
    approx_disk_mb: 570
    known_limitations:
      - "Auxiliary evidence consistency signal only; NOT a guaranteed hallucination detector or factual truth oracle."
      - "Sensitive to strict numerical/metric phrasing differences; never substitutes for deterministic rule checks or M11 approval."

  resume_structured_extractor:
    name: "NexteRaS Hybrid Resume Profile & Skill Extractor"
    model_id: "deterministic-rules-plus-optional-gemini-json"
    version: "1.0.0"
    model_type: "hybrid_parser_and_pluggable_llm"
    task: "resume_skill_and_profile_extraction"
    input_schema: "RawResumeText or SafeUploadFile"
    output_schema: "ExtractedResumeProfile (with evidence spans & missing fields)"
    embedding_dimension: null
    local_path: null
    fallback_model_id: "deterministic-rule-parser-v1"
    license: "Apache-2.0 (internal code)"
    owner: "NexteRaS ML Team"
    fine_tuning_status: "not_applicable"
    evaluation_status: "evaluated_synthetic_resumes"
    lifecycle_status: "EVALUATED"
    approx_ram_mb: 45
    approx_disk_mb: 1
    known_limitations:
      - "Offline rule baseline catches canonical Indian college headers, CGPA, and curated CS/ECE skill taxonomy."
      - "Complex multi-column PDF formatting or unseen domain jargon benefits from Gemini JSON adapter (when GEMINI_API_KEY configured)."

  deterministic_eligibility:
    name: "NexteRaS Deterministic Eligibility & Requirement Engine"
    model_id: "deterministic-rule-engine-v1"
    version: "1.0.0"
    model_type: "deterministic_logic"
    task: "eligibility_assessment"
    input_schema: "StudentAcademicProfile & StructuredEligibilityRequirement"
    output_schema: "EligibilityAssessment (eligible | ineligible | needs_more_info | unable_to_verify)"
    embedding_dimension: null
    local_path: null
    fallback_model_id: null
    license: "Apache-2.0 (internal code)"
    owner: "NexteRaS ML Team"
    fine_tuning_status: "not_applicable"
    evaluation_status: "evaluated_edge_cases"
    lifecycle_status: "EVALUATED"
    approx_ram_mb: 15
    approx_disk_mb: 1
    known_limitations:
      - "Returns needs_more_info / unable_to_verify when student fields or ambiguous JD prerequisites are absent; never guesses."

  opportunity_ranker:
    name: "NexteRaS Constrained Opportunity Ranking Baseline"
    model_id: "deterministic-weighted-ranker-v1"
    version: "1.0.0"
    model_type: "rule_gated_linear_ranker"
    task: "opportunity_ranking"
    input_schema: "EligibilityResult + SemanticScore + Preferences + Metadata"
    output_schema: "RankedOpportunityList with FactorContributions"
    embedding_dimension: null
    local_path: null
    fallback_model_id: "lightgbm-ranker-pending-data"
    license: "Apache-2.0 (internal code)"
    owner: "NexteRaS ML Team"
    fine_tuning_status: "pending_user_interaction_data"
    evaluation_status: "evaluated_synthetic_ranking"
    lifecycle_status: "EVALUATED"
    approx_ram_mb: 20
    approx_disk_mb: 1
    known_limitations:
      - "Supervised GBDT/XGBoost/LightGBM ranker is pending >= 1,000 real user click/save/apply events; no interaction labels fabricated."
