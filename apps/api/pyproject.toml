[project]
name = "opportunity-os-api"
version = "0.1.0"
description = "FastAPI backend, LangGraph agents, and ML services for Opportunity OS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "redis>=5.1.0",
    "websockets>=13.1",
    "pyjwt[crypto]>=2.9.0",
    "pgvector>=0.3.0",
    "arq>=0.26.0",
    "python-multipart>=0.0.12",
    "python-docx>=1.1.2",
    "pymupdf>=1.24.0",
    "fpdf2>=2.8.0",
    "google-genai>=0.1.1",
]

[project.optional-dependencies]
ai = [
    "google-genai>=0.1.1",
    "langgraph>=0.2.35",
    "langgraph-checkpoint-postgres>=2.0.0",
    "sentence-transformers>=3.1.0",
]
worker = [
    "sentence-transformers>=3.1.0",
    "torch>=2.2.0",
    "numpy>=1.26.0",
]
automation = [
    "playwright>=1.47.0",
]
observability = [
    "sentry-sdk>=2.18.0",
    "posthog>=3.7.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
