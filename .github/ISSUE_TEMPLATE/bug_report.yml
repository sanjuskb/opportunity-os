name: "Bug Report"
description: "Submit a bug report to help improve Opportunity OS"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Thank you for reporting an issue in Opportunity OS."
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of the bug."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Detailed steps to reproduce the behavior."
      placeholder: "1. Go to '/opportunities'\n2. Click on...\n3. See error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Environment Details"
      description: "Browser, OS version, Node/Python version"
      placeholder: "Chrome 134, Windows 11, Node 24"
