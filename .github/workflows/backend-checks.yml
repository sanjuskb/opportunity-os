name: "Backend Checks"

on:
  workflow_call:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'ml/**'
      - '.github/workflows/backend-checks.yml'

jobs:
  backend-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync Backend Dependencies (Dev + Observability + Automation)
        working-directory: apps/api
        run: uv sync --frozen --extra dev --extra observability --extra automation

      - name: Run Ruff Lint Check
        working-directory: apps/api
        run: uv run --no-sync ruff check .

      - name: Run Ruff Format Check
        working-directory: apps/api
        run: uv run --no-sync ruff format --check .

      - name: Run MyPy Type Check
        working-directory: apps/api
        run: uv run --no-sync mypy app

      - name: Run FastAPI Unit & Static Migration Tests
        working-directory: apps/api
        run: uv run --no-sync pytest tests/unit -q

  ml-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12 for ML
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ML Core Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt pytest pytest-asyncio python-docx httpx

      - name: Run ML Offline Test Suite
        env:
          PYTHONPATH: .
          HF_HUB_OFFLINE: "1"
        run: python -m pytest ml/tests/test_extraction.py ml/tests/test_multilingual.py ml/tests/test_eligibility.py ml/tests/test_verification.py -q
