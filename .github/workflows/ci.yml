name: "CI Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    uses: ./.github/workflows/frontend-checks.yml

  backend:
    uses: ./.github/workflows/backend-checks.yml

  security:
    uses: ./.github/workflows/security-checks.yml
