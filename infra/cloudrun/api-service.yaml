apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: nexteras-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/nexteras-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: production
            - name: DEBUG
              value: "false"
            - name: PLAYWRIGHT_HEADLESS
              value: "true"
            - name: GEMINI_MODEL
              value: gemini-3-flash-preview
            - name: GEMINI_LIVE_MODEL
              value: gemini-2.5-flash-native-audio-preview-12-2025
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
