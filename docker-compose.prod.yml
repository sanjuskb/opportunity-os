name: opportunity-os-production

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL must be set}
      SUPABASE_JWT_AUDIENCE: authenticated
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://nexteras.app"]}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLOSTEP_API_KEY: ${OLOSTEP_API_KEY:-}
      CRUSTDATA_API_KEY: ${CRUSTDATA_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ARQ_MAX_CONCURRENT_TASKS: "2"
      TORCH_NUM_THREADS: "4"
      PLAYWRIGHT_HEADLESS: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLOSTEP_API_KEY: ${OLOSTEP_API_KEY:-}
      CRUSTDATA_API_KEY: ${CRUSTDATA_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 2560M

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL must be set}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL must be set}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY must be set}
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 1024M

volumes:
  redis_prod_data:
