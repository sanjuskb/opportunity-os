name: opportunity-os

# Local development uses Supabase CLI (`supabase start`) as the single source of truth
# for PostgreSQL 16 + pgvector (port 54322), Auth (GoTrue), and Storage (port 54321).
# Start Supabase before starting the containerized API:
#   supabase start && supabase db reset
#   docker compose up -d
services:
  redis:
    image: redis:7-alpine
    container_name: opportunity-os-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: opportunity-os-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@host.docker.internal:54322/postgres
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLOSTEP_API_KEY=${OLOSTEP_API_KEY:-}
      - CRUSTDATA_API_KEY=${CRUSTDATA_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: opportunity-os-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - api

volumes:
  redis_data:
